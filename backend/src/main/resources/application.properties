# ==========================================
# CONFIGURACION GENERAL
# ==========================================

spring.application.name=hAIr

# ==========================================
# CONFIGURACION DE MYSQL
# ==========================================

# Direccion del servidor y nombre de la base de datos.
spring.datasource.url=jdbc:mysql://localhost:3306/hair

# Credenciales compartidas por el equipo.
spring.datasource.username=root
spring.datasource.password=1234

# Driver de conexion MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HORARIO DEL MODULO DE CITAS
# ==========================================

app.citas.horario.inicio-manana=10:00
app.citas.horario.fin-manana=13:20
app.citas.horario.inicio-tarde=15:30
app.citas.horario.fin-tarde=19:30
app.citas.horario.zona-horaria=Europe/Madrid
