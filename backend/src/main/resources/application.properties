# ==========================================
# CONFIGURACION GENERAL
# ==========================================

spring.application.name=hAIr

# ==========================================
# CONFIGURACION DE MYSQL
# ==========================================

# Direccion del servidor y nombre de la base de datos.
spring.datasource.url=jdbc:mysql://localhost:3306/hair

# Credenciales compartidas por el equipo.
spring.datasource.username=root
spring.datasource.password=root

# Driver de conexion MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# para login con google
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
app.db.url=${DB_URL}
app.db.user=${DB_USER}
app.db.pass=${DB_PASS}
app.jwt.secret=${JWT_SECRET}
app.jwt.horas-validez=8
app.google.client-id=${GOOGLE_CLIENT_ID}
app.cors.origin=${CORS_ORIGIN}
spring.jackson.time-zone=Europe/Madrid
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never