# ==========================================
# CONFIGURACION GENERAL
# ==========================================

spring.application.name=hAIr

# ==========================================
# CONFIGURACION DE MYSQL
# ==========================================

# Direccion del servidor y nombre de la base de datos.
spring.datasource.url=jdbc:mysql://localhost:3306/hair

# Credenciales compartidas por el equipo.
spring.datasource.username=root
spring.datasource.password=root

# Driver de conexion MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACION DE GEMINI (IA)
# ==========================================

# Clave y modelo: se leen de variables de entorno, nunca se escriben aqui.
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}

# Direccion base de la API de Gemini.
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Segundos maximos de espera por una respuesta de Gemini.
gemini.timeout-seconds=30

# ==========================================
# AUTENTICACION Y ARRANQUE DEL ESQUEMA
# ==========================================

# No incluir secretos en el repositorio. JWT_SECRET debe tener al menos 32 bytes aleatorios.
app.jwt.secret=${JWT_SECRET}
app.google.client-id=${GOOGLE_CLIENT_ID}
spring.sql.init.mode=always
